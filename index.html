<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#C9886C" id="theme-color-meta">
  <meta name="description" content="Sovereign — Soukaina's personal life operating system for growth, wellness, and mastery.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Sovereign">
  <meta property="og:title" content="Sovereign — Your Life OS">
  <meta property="og:description" content="Personal life operating system for growth, wellness, and mastery.">
  <link rel="apple-touch-icon" href="/icons/icon.svg">
  <link rel="manifest" href="/manifest.json">
  <title>Sovereign — Your Life OS</title>

  <!-- Premium Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>

  <!-- ═══════════════════════════════════════════
       SPLASH SCREEN
  ═══════════════════════════════════════════ -->
  <div id="splash-screen">
    <div class="splash-inner">
      <div class="splash-logo">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" class="splash-crown-svg">
          <defs>
            <linearGradient id="splashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#E8C4B8"/>
              <stop offset="100%" style="stop-color:#C9886C"/>
            </linearGradient>
          </defs>
          <path d="M50 10 L58 32 L83 32 L62 46 L70 68 L50 54 L30 68 L38 46 L17 32 L42 32 Z"
                fill="url(#splashGrad)" opacity="0.95"/>
          <circle cx="50" cy="13" r="3" fill="#F5D0C8"/>
          <circle cx="38" cy="46" r="2" fill="#E8C4B8"/>
          <circle cx="62" cy="46" r="2" fill="#E8C4B8"/>
        </svg>
      </div>
      <h1 class="splash-appname" id="splash-appname">Sovereign</h1>
      <p class="splash-tagline">Your Personal Life Operating System</p>
      <div class="splash-loader">
        <div class="splash-loader-bar"></div>
      </div>
    </div>
  </div>

  <!-- ═══════════════════════════════════════════
       ONBOARDING (injected by JS)
  ═══════════════════════════════════════════ -->
  <div id="onboarding" class="hidden"></div>

  <!-- ═══════════════════════════════════════════
       MAIN APP
  ═══════════════════════════════════════════ -->
  <div id="app" class="hidden">

    <!-- Header -->
    <header id="app-header">
      <div class="header-left">
        <button class="header-back-btn icon-btn hidden" id="header-back-btn" aria-label="Go back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M5 12l7-7M5 12l7 7"/>
          </svg>
        </button>
        <div class="header-brand">
          <span class="header-brand-icon">✦</span>
          <span class="app-name-text">Sovereign</span>
        </div>
      </div>
      <div class="header-center">
        <h2 id="header-section-title" class="header-title">Today</h2>
        <p class="header-subtitle"></p>
      </div>
      <div class="header-right">
        <button id="notif-btn" class="icon-btn" aria-label="Notifications">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
          <span class="notif-badge hidden" id="notif-badge">3</span>
        </button>
        <button id="profile-btn" class="icon-btn profile-btn" aria-label="Profile & Settings">
          <div class="profile-avatar" id="profile-avatar">S</div>
        </button>
      </div>
    </header>

    <!-- Main Content -->
    <main id="main-content" role="main">
      <section id="section-today"    class="app-section" aria-label="Today's Schedule"></section>
      <section id="section-academy"  class="app-section" aria-label="Developer Academy"></section>
      <section id="section-work"     class="app-section" aria-label="IELTS Work Studio"></section>
      <section id="section-wellness" class="app-section" aria-label="Wellness & Care"></section>
      <section id="section-tasks"    class="app-section" aria-label="My Tasks"></section>
      <section id="section-vault"    class="app-section" aria-label="The Vault"></section>
      <section id="section-codelab"  class="app-section" aria-label="Code Lab"></section>
      <section id="section-journal"  class="app-section" aria-label="Journal & Fun Zone"></section>
      <section id="section-settings" class="app-section" aria-label="Settings"></section>
    </main>

    <!-- Bottom Navigation -->
    <nav id="bottom-nav" role="navigation" aria-label="Main navigation">
      <button class="nav-btn active" data-section="today" aria-label="Today">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
        </span>
        <span class="nav-label">Today</span>
      </button>
      <button class="nav-btn" data-section="academy" aria-label="Academy">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
            <path d="M6 12v5c3 3 9 3 12 0v-5"/>
          </svg>
        </span>
        <span class="nav-label">Academy</span>
      </button>
      <button class="nav-btn" data-section="work" aria-label="Work">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="7" width="20" height="14" rx="2" ry="2"/>
            <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/>
          </svg>
        </span>
        <span class="nav-label">Work</span>
      </button>
      <button class="nav-btn" data-section="wellness" aria-label="Wellness">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
          </svg>
        </span>
        <span class="nav-label">Wellness</span>
      </button>
      <button class="nav-btn" data-section="tasks" aria-label="Tasks">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="9 11 12 14 22 4"/>
            <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
          </svg>
        </span>
        <span class="nav-label">Tasks</span>
      </button>
      <button class="nav-btn" data-section="more" aria-label="More sections" id="more-nav-btn">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/>
          </svg>
        </span>
        <span class="nav-label">More</span>
      </button>
    </nav>

    <!-- More Sheet (slides up) -->
    <div id="more-sheet" class="bottom-sheet" role="dialog" aria-label="More sections" aria-hidden="true">
      <div class="sheet-handle" aria-hidden="true"></div>
      <h4 class="sheet-title">More Sections</h4>
      <div class="more-grid">
        <button class="more-btn" data-section="vault">
          <div class="more-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
            </svg>
          </div>
          <span>Vault</span>
        </button>
        <button class="more-btn" data-section="codelab">
          <div class="more-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="16 18 22 12 16 6"/>
              <polyline points="8 6 2 12 8 18"/>
            </svg>
          </div>
          <span>Code Lab</span>
        </button>
        <button class="more-btn" data-section="journal">
          <div class="more-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
            </svg>
          </div>
          <span>Journal</span>
        </button>
        <button class="more-btn" data-section="settings">
          <div class="more-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
            </svg>
          </div>
          <span>Settings</span>
        </button>
      </div>
    </div>

    <!-- Sheet/Modal Backdrop -->
    <div id="sheet-backdrop" class="hidden" role="presentation"></div>

    <!-- AI Floating Action Button -->
    <button id="ai-fab" class="ai-fab" aria-label="Open AI Assistant">
      <span class="ai-fab-icon">✦</span>
      <span class="ai-fab-label">Ask AI</span>
    </button>

    <!-- AI Panel (injected by assistant.js) -->
    <div id="ai-panel" class="ai-panel hidden" role="dialog" aria-label="AI Assistant">
      <div class="ai-panel-inner" id="ai-panel-inner"></div>
    </div>

    <!-- Reminder Overlay (injected by reminders.js) -->
    <div id="reminder-overlay" class="reminder-overlay hidden" role="alertdialog" aria-live="assertive"></div>

    <!-- Modal Container -->
    <div id="modal-container" class="modal-container" style="display:none" role="dialog" aria-modal="true"></div>

    <!-- Toast Notifications -->
    <div id="toast-container" class="toast-container" aria-live="polite" aria-atomic="false"></div>

  </div><!-- /#app -->

  <!-- ═══════════════════════════════════════════
       SCRIPTS (exact load order required)
  ═══════════════════════════════════════════ -->
  <script src="/js/storage.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/claude.js"></script>
  <script src="/js/reminders.js"></script>
  <script src="/js/curriculum-data.js"></script>
  <script src="/js/onboarding.js"></script>
  <script src="/js/sections/today.js"></script>
  <script src="/js/sections/academy.js"></script>
  <script src="/js/sections/work.js"></script>
  <script src="/js/sections/wellness.js"></script>
  <script src="/js/sections/tasks.js"></script>
  <script src="/js/sections/vault.js"></script>
  <script src="/js/sections/codelab.js"></script>
  <script src="/js/sections/journal.js"></script>
  <script src="/js/sections/assistant.js"></script>
  <script src="/js/sections/settings.js"></script>
  <script src="/js/app.js"></script>

</body>
</html>
