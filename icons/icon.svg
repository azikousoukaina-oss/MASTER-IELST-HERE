<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2D1A24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A0E14;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="crownGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8C4B8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#C9886C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A66C52;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5D0C8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C9886C;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  <!-- Subtle inner glow ring -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#C9886C" stroke-width="1" stroke-opacity="0.2"/>
  <!-- Crown base -->
  <rect x="156" y="320" width="200" height="32" rx="8" fill="url(#crownGrad)"/>
  <!-- Crown body -->
  <path d="M 156 320 L 156 260 L 200 290 L 256 200 L 312 290 L 356 260 L 356 320 Z" fill="url(#crownGrad)" filter="url(#glow)"/>
  <!-- Crown gems -->
  <circle cx="256" cy="205" r="10" fill="#F5D0C8"/>
  <circle cx="200" cy="294" r="7" fill="#E8C4B8"/>
  <circle cx="312" cy="294" r="7" fill="#E8C4B8"/>
  <!-- Star accent above crown -->
  <path d="M 256 130 L 262 150 L 283 150 L 266 163 L 272 183 L 256 170 L 240 183 L 246 163 L 229 150 L 250 150 Z" fill="url(#starGrad)" filter="url(#glow)"/>
  <!-- Decorative dots -->
  <circle cx="156" cy="380" r="5" fill="#C9886C" fill-opacity="0.6"/>
  <circle cx="356" cy="380" r="5" fill="#C9886C" fill-opacity="0.6"/>
  <circle cx="196" cy="390" r="3" fill="#C9886C" fill-opacity="0.4"/>
  <circle cx="316" cy="390" r="3" fill="#C9886C" fill-opacity="0.4"/>
</svg>
