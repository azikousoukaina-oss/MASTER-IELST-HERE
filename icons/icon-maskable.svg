<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2D1A24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A0E14;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="crownGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8C4B8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#C9886C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#A66C52;stop-opacity:1" />
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Full bleed background for maskable -->
  <rect width="512" height="512" fill="url(#bgGrad2)"/>
  <!-- Crown base -->
  <rect x="156" y="320" width="200" height="32" rx="8" fill="url(#crownGrad2)"/>
  <!-- Crown body -->
  <path d="M 156 320 L 156 260 L 200 290 L 256 200 L 312 290 L 356 260 L 356 320 Z" fill="url(#crownGrad2)" filter="url(#glow2)"/>
  <!-- Crown gems -->
  <circle cx="256" cy="205" r="10" fill="#F5D0C8"/>
  <circle cx="200" cy="294" r="7" fill="#E8C4B8"/>
  <circle cx="312" cy="294" r="7" fill="#E8C4B8"/>
  <!-- Star accent -->
  <path d="M 256 130 L 262 150 L 283 150 L 266 163 L 272 183 L 256 170 L 240 183 L 246 163 L 229 150 L 250 150 Z" fill="#F5D0C8" filter="url(#glow2)"/>
</svg>
